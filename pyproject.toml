[project]
name = "enterprise-agent"
version = "0.1.0"
description = "多模态企业级智能体系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "langgraph==0.2.28",
    "langchain==0.3.1",
    "langchain-openai==0.2.1",
    "langchain-community==0.3.1",
    "openai==1.47.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg>=0.30.0",
    "alembic==1.13.2",
    "redis==5.1.1",
    "pymilvus==2.4.7",
    "neo4j==5.24.0",
    "boto3==1.35.19",
    "httpx==0.27.2",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.8",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]
multimodal = [
    "openai-whisper>=20231117",
    "Pillow==10.4.0",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "PyPDF2==3.0.1",
    "edge-tts==6.1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "shared"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
